<header class="navbar-header">
    <div class="nav-container">
        <a href="{% url 'search_page' %}" class="brand-logo">
            <span class="logo-icon">✨</span>
            <span class="logo-text">Decor<span class="logo-accent">Finder</span> <span class="badge-usa">USA</span></span>
        </a>
        <nav class="nav-menu">
            {% if user.is_authenticated %}
                <a href="{% url 'search_page' %}" class="nav-link">🔍 Find Buyers</a>
                <a href="{% url 'campaign_compose' %}" class="nav-link">✉️ New Pitch</a>
                <a href="{% url 'campaign_history' %}" class="nav-link">📊 Email Logs</a>
                <div class="user-profile-badge">
                    <span class="user-avatar">{{ user.username|make_list|first|upper }}</span>
                    <span class="user-name">{{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}" class="inline-form">
                        {% csrf_token %}
                        <button type="submit" class="btn-link-logout">Logout</button>
                    </form>
                </div>
            {% else %}
                <a href="{% url 'login' %}" class="nav-link">Log In</a>
                <a href="{% url 'register' %}" class="btn-primary-sm">Get Started</a>
            {% endif %}
        </nav>
    </div>
</header>
